namespace: myapp

imagePullPolicy: IfNotPresent

frontend:
  image:
    repository: registry.example.com/myapp/frontend
    tag: "1.0.0"
  replicas: 2
  port: 80
  env: []
  resources: {}

backend:
  image:
    repository: registry.example.com/myapp/backend
    tag: "1.0.0"
  replicas: 2
  port: 8080
  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: url
  resources: {}

postgres:
  image:
    repository: postgres
    tag: "16.3"
  storage:
    size: 10Gi
  port: 5432
  auth:
    user: myapp
    password: mysecret
    db: myapp
  resources: {}

ingress:
  enabled: false
  className: ""
  host: myapp.local
