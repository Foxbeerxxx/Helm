apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-frontend
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["/bin/sh","-c"]
      args:
        - curl -fsS http://{{ .Release.Name }}-frontend.{{ .Release.Namespace }}.svc.cluster.local/ | grep -q "Welcome to nginx"
